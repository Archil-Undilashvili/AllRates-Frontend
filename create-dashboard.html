<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/favicon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/favicon-192.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>შენი Watch List - AllRates.ge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=23">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KFQ7LLZ9EF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KFQ7LLZ9EF');
    </script>
</head>
<body class="user-side-body">
    <script src="js/header.js"></script>

    <main class="user-side-page">
        <div class="user-side-topbar">
            <section class="user-side-tabs" aria-label="მომხმარებლის გვერდები">
                <button class="user-side-tab active" type="button" data-user-tab="watchlist">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9L12 3Z"></path></svg>
                    <span>Watch List</span>
                </button>
                <button class="user-side-tab" type="button" data-user-tab="calendar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v4M17 3v4"></path><path d="M4 8h16"></path><rect x="4" y="5" width="16" height="16" rx="3"></rect><path d="M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01"></path></svg>
                    <span>ეკონომიკური კალენდარი</span>
                </button>
            </section>

            <div class="watch-search-area">
                <label class="watch-search-box">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
                    <input id="watchSearchInput" type="search" placeholder="მოძებნე მონაცემი..." autocomplete="off">
                </label>
                <div id="watchSearchDropdown" class="watch-search-dropdown" hidden></div>
            </div>
        </div>

        <section id="watchlistPanel" class="user-watchlist-panel">
            <div class="watch-category-row" role="tablist" aria-label="Watchlist კატეგორიები">
                <button class="watch-category-btn active" type="button" data-category="official"><img src="Logos/nbg_logo_cropped.png" alt=""><span>ოფიციალური კურსები</span></button>
                <button class="watch-category-btn" type="button" data-category="market"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h16"></path><path d="M7 14l3-3 3 2 4-6"></path><path d="M15 7h2v2"></path></svg><span>საბაზრო კურსები</span></button>
                <button class="watch-category-btn" type="button" data-category="company"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11"></path><path d="M15 4l3 3-3 3"></path><path d="M17 17H6"></path><path d="M9 14l-3 3 3 3"></path></svg><span>კომპანიის კურსები</span></button>
                <button class="watch-category-btn" type="button" data-category="forex"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M4 12h16"></path><path d="M12 4a12 12 0 0 1 0 16"></path><path d="M12 4a12 12 0 0 0 0 16"></path></svg><span>Forex</span></button>
                <button class="watch-category-btn" type="button" data-category="crypto"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M9 8h4.5a2 2 0 0 1 0 4H9"></path><path d="M9 12h5a2 2 0 0 1 0 4H9"></path><path d="M10 6v12M14 6v12"></path></svg><span>კრიპტოვალუტები</span></button>
                <button class="watch-category-btn" type="button" data-category="fuel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15"></path><path d="M4 20h12"></path><path d="M8 8h4"></path><path d="M15 7h2l2 2v8a2 2 0 0 0 4 0v-4"></path></svg><span>საწვავის ფასები</span></button>
                <button class="watch-category-btn" type="button" data-category="asset"><svg viewBox="0 0 24 24" aria-hidden="true" class="watch-assets-icon"><path d="M5 18V9"></path><path d="M10 18V5"></path><path d="M15 18v-7"></path><path d="M20 18V3"></path><path d="M4 21h17"></path></svg><span>აქციები.სხვ</span></button>
            </div>

            <section class="watchlist-wrap" aria-label="არჩეული Watchlist">
                <div class="watchlist-head">
                    <h1>შენი Watch List</h1>
                    <span id="watchSaveStatus" aria-live="polite"></span>
                </div>
                <div id="watchlistItems" class="watchlist-items"></div>
            </section>
        </section>

        <section id="calendarPanel" class="user-calendar-panel" hidden>
            <div class="economic-calendar-head">
                <div>
                    <h2>ეკონომიკური კალენდარი</h2>
                    <p>GE, US, EU და UK - მხოლოდ მაღალი მნიშვნელობის მომავალი მოვლენები</p>
                </div>
                <button type="button" id="calendarRefreshBtn" class="economic-calendar-refresh" aria-label="კალენდრის განახლება">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.1 6.6"></path><path d="M3 12A9 9 0 0 1 18.1 5.4"></path><path d="M21 3v6h-6"></path><path d="M3 21v-6h6"></path></svg>
                </button>
            </div>
            <div class="economic-calendar-filters" aria-label="ეკონომიკური კალენდრის ფილტრები">
                <div class="calendar-country-filters" aria-label="ქვეყნების არჩევა">
                    <label><input type="checkbox" value="GE" data-calendar-country checked><span>საქართველო</span></label>
                    <label><input type="checkbox" value="US" data-calendar-country checked><span>US</span></label>
                    <label><input type="checkbox" value="EU" data-calendar-country checked><span>EU</span></label>
                    <label><input type="checkbox" value="UK" data-calendar-country checked><span>UK</span></label>
                </div>
                <div class="calendar-period-filters" aria-label="პერიოდის არჩევა">
                    <button type="button" class="active" data-calendar-period="current-week">მიმდინარე კვირა</button>
                    <button type="button" data-calendar-period="next-week">შემდეგი კვირა</button>
                    <button type="button" data-calendar-period="next-month">შემდეგი თვე</button>
                </div>
                <div class="calendar-custom-range" aria-label="ინდივიდუალური პერიოდი">
                    <label><span>დან</span><input type="date" id="calendarFromDate"></label>
                    <label><span>მდე</span><input type="date" id="calendarToDate"></label>
                </div>
            </div>
            <div id="economicCalendarContent" class="economic-calendar-content">
                <p class="watch-empty">კალენდარი ჩაიტვირთება გვერდზე გადასვლისას.</p>
            </div>
        </section>
    </main>

    <script src="js/watchlist.js?v=10"></script>
</body>
</html>
